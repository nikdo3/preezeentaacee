<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JET-Česko – Synchronizovaná Prezentace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Red+Hat+Text:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app-root">
    <!-- Subtle Master Mode HUD (Hidden in Client Mode) -->
    <div id="master-hud" class="hidden" data-testid="master-hud">
      <span id="sync-dot" class="hud-dot"></span>
      <span>MASTER</span>
      <span>•</span>
      <span>Diváci: <strong id="viewer-count" data-testid="viewer-count">0</strong></span>
      <span>•</span>
      <span id="master-slide-pos" data-testid="master-slide-pos">0/0</span>
    </div>

    <!-- Reveal.js Presentation Viewport -->
    <div class="reveal">
      <div class="slides" id="slides-container"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
